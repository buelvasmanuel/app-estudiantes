<!DOCTYPE html>
<html lang="es">
<head>
  <!-- La ruta base la pone `flutter build web --base-href …`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Campus Detective: un juego para aprender a leer datos de estudiantes, con casos, rescates y duelos de cartas.">
  <meta name="theme-color" content="#151A33" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4EBD6" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Campus Detective">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Detective</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pantalla de carga mientras se descarga la app (antes, unos segundos
       en blanco). Con los colores de los temas: Expediente (claro) o Noche
       (oscuro), según el sistema. Desaparece con el primer cuadro de Flutter. -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #F4EBD6; color: #2A2622; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms;
    }
    #carga .giro {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid rgba(31, 78, 140, 0.25); border-top-color: #1F4E8C;
      animation: girar 1s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #151A33; color: #EEF0FF; }
      #carga .giro { border-color: rgba(255, 200, 87, 0.25); border-top-color: #FFC857; }
    }
    @media (prefers-reduced-motion: reduce) {
      #carga .giro { animation: none; border-top-color: transparent; }
    }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <div class="giro" aria-hidden="true"></div>
    <div>Cargando Campus Detective…</div>
  </div>
  <script>
    // Se quita cuando Flutter pinta su primer cuadro.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (c) { c.style.opacity = '0'; setTimeout(function () { c.remove(); }, 250); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
